server {
    listen       80;
    server_name  www.pcp.com.py;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Cabecera X-Robots-Tag (equivalente a Apache Header set)
    add_header X-Robots-Tag "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" always;

    # Servir index.html sin redirigir (evita loop en /blog/)
    location ~ /index\.html$ {
        try_files $uri =404;
    }

    # /archivo.html -> /archivo (no aplica a index.html)
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location / {
        # 1) archivo exacto  2) carpeta/index  3) archivo.html  4) 404
        try_files $uri $uri/ $uri.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        internal;
    }
}
