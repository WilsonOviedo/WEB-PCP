# Redirección www → apex (canónico: https://pcp.com.py)
server {
    listen       80;
    server_name  www.pcp.com.py;
    return 301   https://pcp.com.py$request_uri;
}

server {
    listen       80;
    server_name  pcp.com.py;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Compresión (Brotli si el módulo está disponible en el host; gzip siempre)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    add_header X-Robots-Tag "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" always;

    # 301 URLs cortas legacy → URLs SEO largas
    location = /automatizacion {
        return 301 /automatizacion-industrial$is_args$args;
    }
    location = /telemetria {
        return 301 /telemetria-industrial$is_args$args;
    }
    location = /proyectos-electricos {
        return 301 /proyectos-electricos-industriales$is_args$args;
    }
    location = /mantenimiento-industrial {
        return 301 /mantenimiento-electrico-industrial$is_args$args;
    }

    # Servir index.html sin redirigir (evita loop en /blog/)
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # /archivo.html -> /archivo (no aplica a index.html)
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Assets estáticos: caché larga
    location ~* \.(?:css|js|mjs|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:webp|avif|jpg|jpeg|png|gif|ico|svg|woff2|woff)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        # HTML sin hash: revalidación
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        internal;
    }
}
